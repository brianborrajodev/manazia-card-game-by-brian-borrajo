<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1250" viewBox="0 0 1600 1250" role="img" aria-labelledby="title desc">
  <title id="title">Esquema de base de datos de Manazia</title>
  <desc id="desc">Diagrama entidad-relación generado a partir de schema.dbml. Muestra usuarios, perfiles, modos, cola de emparejamiento, partidas y participantes.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172554" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#1e293b}
      .title{font-size:30px;font-weight:750;fill:#0f172a}.subtitle{font-size:14px;fill:#64748b}
      .card{fill:#fff;stroke:#dbe4f0;stroke-width:1.4;filter:url(#shadow)}
      .head{fill:#eff6ff}.headline{font-size:16px;font-weight:700;fill:#1d4ed8}.field{font-size:12.5px}.muted{fill:#64748b}.tag{font-size:10px;font-weight:700;fill:#475569}
      .relation{fill:none;stroke:#64748b;stroke-width:1.8;marker-end:url(#arrow)}
      .enumcard{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}.enumtitle{font-size:13px;font-weight:700;fill:#334155}.enumval{font-size:11px;fill:#475569}
      .legend{font-size:11px;fill:#475569}
    </style>
  </defs>
  <rect width="1600" height="1250" fill="#f8fafc"/>
  <text x="48" y="52" class="title">Manazia · Esquema de base de datos</text>
  <text x="48" y="78" class="subtitle">Diagrama entidad-relación · basado en docs/database/schema.dbml</text>

  <!-- Relationships are behind the entity cards. Arrow points to the referenced (parent) table. -->
  <path class="relation" d="M 360 250 H 445"/><text x="374" y="239" class="tag">1 : 0..1</text>
  <path class="relation" d="M 230 433 V 525 H 250 V 666"/><text x="238" y="515" class="tag">1 : N</text>
  <path class="relation" d="M 360 352 H 412 V 590 H 485"/><text x="370" y="372" class="tag">1 : N</text>
  <path class="relation" d="M 360 304 H 385 V 850 H 485"/><text x="368" y="835" class="tag">1 : N</text>
  <path class="relation" d="M 1010 250 H 1080"/><text x="1020" y="239" class="tag">1 : N</text>
  <path class="relation" d="M 800 414 V 470 H 1170 V 525"/><text x="820" y="458" class="tag">1 : N</text>
  <path class="relation" d="M 800 414 V 573 H 900 V 666"/><text x="813" y="561" class="tag">1 : N</text>
  <path class="relation" d="M 1225 525 V 475 H 1035 V 414 H 1010"/><text x="1050" y="462" class="tag">0..N : 1</text>
  <path class="relation" d="M 790 666 V 620 H 760 V 414"/><text x="768" y="636" class="tag">1 : N</text>

  <!-- users -->
  <g transform="translate(50 125)"><rect class="card" width="310" height="308" rx="12"/><path class="head" d="M12 0h286a12 12 0 0 1 12 12v38H0V12A12 12 0 0 1 12 0"/><text x="18" y="32" class="headline">users</text>
    <text x="18" y="72" class="field"><tspan font-weight="700">id</tspan><tspan class="muted"> · uuid · PK</tspan></text><text x="18" y="98" class="field">user_type · user_type · NOT NULL</text><text x="18" y="124" class="field">display_name · varchar(50) · NOT NULL</text><text x="18" y="150" class="field">created_at · timestamp · NOT NULL</text><text x="18" y="176" class="field">last_active_at · timestamp</text><text x="18" y="202" class="field">guest_token · varchar(128) · UNIQUE</text><text x="18" y="228" class="field">email · varchar(255) · UNIQUE</text><text x="18" y="254" class="field">password_hash · varchar(255)</text><text x="18" y="280" class="field">is_verified · boolean · NOT NULL</text>
  </g>
  <!-- player_profiles -->
  <g transform="translate(445 125)"><rect class="card" width="300" height="225" rx="12"/><path class="head" d="M12 0h276a12 12 0 0 1 12 12v38H0V12A12 12 0 0 1 12 0"/><text x="18" y="32" class="headline">player_profiles</text>
    <text x="18" y="72" class="field"><tspan font-weight="700">user_id</tspan><tspan class="muted"> · uuid · PK, FK</tspan></text><text x="18" y="98" class="field">rating · int · NOT NULL · default 1000</text><text x="18" y="124" class="field">wins · int · NOT NULL</text><text x="18" y="150" class="field">losses · int · NOT NULL</text><text x="18" y="176" class="field">draws · int · NOT NULL</text><text x="18" y="202" class="field">updated_at · timestamp · NOT NULL</text>
  </g>
  <!-- game_modes -->
  <g transform="translate(1080 125)"><rect class="card" width="350" height="289" rx="12"/><path class="head" d="M12 0h326a12 12 0 0 1 12 12v38H0V12A12 12 0 0 1 12 0"/><text x="18" y="32" class="headline">game_modes</text>
    <text x="18" y="72" class="field"><tspan font-weight="700">id</tspan><tspan class="muted"> · uuid · PK</tspan></text><text x="18" y="98" class="field">code · varchar(50) · UNIQUE, NOT NULL</text><text x="18" y="124" class="field">name · varchar(100) · NOT NULL</text><text x="18" y="150" class="field">mode_type · game_mode_type · NOT NULL</text><text x="18" y="176" class="field">requires_account · boolean · NOT NULL</text><text x="18" y="202" class="field">is_active · boolean · NOT NULL</text><text x="18" y="251" class="muted" font-size="11">Catálogo de modos de juego</text>
  </g>
  <!-- matches -->
  <g transform="translate(485 666)"><rect class="card" width="335" height="263" rx="12"/><path class="head" d="M12 0h311a12 12 0 0 1 12 12v38H0V12A12 12 0 0 1 12 0"/><text x="18" y="32" class="headline">matches</text>
    <text x="18" y="72" class="field"><tspan font-weight="700">id</tspan><tspan class="muted"> · uuid · PK</tspan></text><text x="18" y="98" class="field">game_mode_id · uuid · FK, NOT NULL</text><text x="18" y="124" class="field">status · match_status · NOT NULL</text><text x="18" y="150" class="field">max_players · int · NOT NULL · default 2</text><text x="18" y="176" class="field">created_at · timestamp · NOT NULL</text><text x="18" y="202" class="field">started_at · timestamp</text><text x="18" y="228" class="field">ended_at · timestamp</text>
  </g>
  <!-- matchmaking_queue -->
  <g transform="translate(1050 525)"><rect class="card" width="360" height="317" rx="12"/><path class="head" d="M12 0h336a12 12 0 0 1 12 12v38H0V12A12 12 0 0 1 12 0"/><text x="18" y="32" class="headline">matchmaking_queue</text>
    <text x="18" y="72" class="field"><tspan font-weight="700">id</tspan><tspan class="muted"> · uuid · PK</tspan></text><text x="18" y="98" class="field">user_id · uuid · FK, NOT NULL</text><text x="18" y="124" class="field">game_mode_id · uuid · FK, NOT NULL</text><text x="18" y="150" class="field">status · queue_status · NOT NULL</text><text x="18" y="176" class="field">mmr_snapshot · int · NOT NULL</text><text x="18" y="202" class="field">queued_at · timestamp · NOT NULL</text><text x="18" y="228" class="field">matched_at · timestamp</text><text x="18" y="254" class="field">match_id · uuid · FK</text><text x="18" y="291" class="muted" font-size="11">Índice: game_mode_id + status + queued_at</text>
  </g>
  <!-- match_participants -->
  <g transform="translate(50 666)"><rect class="card" width="360" height="289" rx="12"/><path class="head" d="M12 0h336a12 12 0 0 1 12 12v38H0V12A12 12 0 0 1 12 0"/><text x="18" y="32" class="headline">match_participants</text>
    <text x="18" y="72" class="field"><tspan font-weight="700">id</tspan><tspan class="muted"> · uuid · PK</tspan></text><text x="18" y="98" class="field">match_id · uuid · FK, NOT NULL</text><text x="18" y="124" class="field">user_id · uuid · FK, NOT NULL</text><text x="18" y="150" class="field">slot_number · int · NOT NULL</text><text x="18" y="176" class="field">outcome · match_outcome</text><text x="18" y="202" class="field">rating_delta · int</text><text x="18" y="228" class="field">joined_at · timestamp · NOT NULL</text><text x="18" y="265" class="muted" font-size="11">Únicos: (match_id, user_id), (match_id, slot_number)</text>
  </g>

  <!-- Enum reference -->
  <text x="50" y="1010" class="headline" font-size="14">ENUMS</text>
  <g transform="translate(50 1030)"><rect class="enumcard" width="240" height="135" rx="10"/><text x="16" y="26" class="enumtitle">user_type</text><text x="16" y="52" class="enumval">guest · account</text><text x="16" y="84" class="enumtitle">game_mode_type</text><text x="16" y="110" class="enumval">offline · online</text></g>
  <g transform="translate(310 1030)"><rect class="enumcard" width="250" height="135" rx="10"/><text x="16" y="26" class="enumtitle">queue_status</text><text x="16" y="52" class="enumval">waiting · matched · cancelled</text><text x="16" y="84" class="enumtitle">match_status</text><text x="16" y="110" class="enumval">pending · in_progress · finished · aborted</text></g>
  <g transform="translate(580 1030)"><rect class="enumcard" width="230" height="135" rx="10"/><text x="16" y="26" class="enumtitle">match_outcome</text><text x="16" y="52" class="enumval">win · loss · draw</text><text x="16" y="91" class="legend">Las flechas apuntan a la tabla referenciada (FK).</text></g>
  <text x="50" y="1210" class="subtitle">PK = clave primaria · FK = clave foránea · UNIQUE = valor único</text>
</svg>
